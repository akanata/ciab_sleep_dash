[project]
name = "sleep-dash"
version = "0.1.0"
description = "Sleep dashboard for Cloud in a Bottle health data"
requires-python = "==3.12.*"
dependencies = [
    "litestar>=2.24",
    "hypercorn>=0.18",
    # >=24.1: FunctionDispatch takes_converter, relied on by the spec's converter.
    "attrs>=24.1",
    "cattrs>=24.1",
    "health-data-service @ git+https://github.com/cloud-in-a-bottle/health-data-service-spec@main",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    # litestar.testing.TestClient is built on httpx.
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/sleep_dash"]

[tool.pytest.ini_options]
addopts = "-v"
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Ruff formats Python code blocks inside Markdown. plan.md and AGENTS.md are the
# design of record, not source; reformatting their snippets is pure noise.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
    "E",       # pycodestyle errors
    "F",       # pyflakes
    "B",       # flake8-bugbear
    "UP",      # pyupgrade (modern Python syntax)
    "I",       # isort
    "PLC0415", # import-outside-top-level
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
force-single-line = true
case-sensitive = true
known-first-party = ["sleep_dash"]

[tool.mypy]
python_version = "3.12"
mypy_path = ["src"]
packages = ["sleep_dash"]
strict = true
ignore_missing_imports = true
# health-data-service ships full type annotations but no py.typed marker; without
# this mypy would treat every import from it as Any.
follow_untyped_imports = true
